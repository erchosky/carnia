services:
  postgres:
    image: postgres:16-alpine
    container_name: carnia-postgres
    environment:
      POSTGRES_USER: carnia
      POSTGRES_PASSWORD: carnia
      POSTGRES_DB: carnia
    ports:
      - "5433:5432"
    volumes:
      - carnia_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carnia"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: carnia-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - carnia_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  carnia_pg:
  carnia_redis:
