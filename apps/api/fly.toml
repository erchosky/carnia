app = "carnia-api"
primary_region = "mad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "apps/api/Dockerfile"

[deploy]
  # Se ejecuta UNA vez antes de arrancar instances. Idempotente.
  release_command = "node packages/db/node_modules/prisma/build/index.js migrate deploy --config packages/db/prisma.config.ts"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  API_PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health/live"

[[services]]
  protocol = "tcp"
  internal_port = 3001

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  # WebSockets necesitan que el LB no termine la conexión
  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
